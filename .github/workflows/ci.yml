name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-targets:
    name: build-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: loong64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        if: matrix.target.os == 'linux' && matrix.target.arch == 'amd64'
        run: go test -tags nexlab_nowebview -count=1 ./...

      - name: Build teacher and student clients
        shell: bash
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p "ci-out/${GOOS}-${GOARCH}"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -tags nexlab_nowebview -o "ci-out/${GOOS}-${GOARCH}/matrixclass-teacher${suffix}" ./cmd/teacher
          go build -tags nexlab_nowebview -o "ci-out/${GOOS}-${GOARCH}/matrixclass-student${suffix}" ./cmd/student

  test-and-build:
    name: test-and-build
    if: always()
    needs: build-targets
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI targets to pass
        if: needs.build-targets.result != 'success'
        run: |
          echo "build-targets result: ${{ needs.build-targets.result }}"
          exit 1
      - name: CI passed
        run: echo "All CI tests and builds passed."

