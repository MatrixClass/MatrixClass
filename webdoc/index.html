<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="矩联电子教室 MatrixClass 官方文档" />
  <title>MatrixClass 文档</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="MatrixClass 首页">
        <span class="brand-mark">M</span>
        <span class="brand-copy"><strong>MatrixClass</strong><small>矩联电子教室</small></span>
      </a>
      <div class="topbar-actions">
        <button class="search-trigger" id="search-trigger" type="button"><span>⌕</span><span>搜索文档</span><kbd>Ctrl K</kbd></button>
        <a class="github-link" href="https://github.com/MatrixClass/MatrixClass" target="_blank" rel="noreferrer">GitHub ↗</a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="切换主题">◐</button>
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="打开菜单">☰</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
          <div class="version-chip"><span class="status-dot"></span> 当前版本 <strong>main</strong></div>
          <nav id="sidebar-nav" aria-label="文档导航"></nav>
          <div class="sidebar-footer"><span>Go + MyGo + KCP</span><a href="https://github.com/MatrixClass/MatrixClass" target="_blank" rel="noreferrer">查看源码 →</a></div>
        </div>
      </aside>

      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="search-modal" id="search-modal" hidden>
    <div class="search-backdrop" data-close-search></div>
    <section class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="search-heading"><strong id="search-title">搜索文档</strong><button class="icon-button" data-close-search type="button">×</button></div>
      <input id="search-input" type="search" placeholder="输入关键词，例如：频道 ID、KCP、作业" autocomplete="off" />
      <div class="search-results" id="search-results"></div>
      <div class="search-hint">按 <kbd>Esc</kbd> 关闭，按 <kbd>↑</kbd><kbd>↓</kbd>选择结果</div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
